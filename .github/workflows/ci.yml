name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: russisch-leren/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: russisch-leren/backend/package-lock.json
      - run: npm install
      - run: npm test

  # Builds the add-on image exactly as Supervisor would, for every arch in
  # config.yaml, and checks the server actually starts. better-sqlite3 is the
  # only native dependency, so this is what breaks first on a new platform.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: russisch-leren
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
          tags: russisch-leren:${{ matrix.arch }}
          load: true
      - name: Smoke test /api/health
        run: |
          docker run -d --name rl --platform ${{ matrix.platform }} -p 3000:3000 \
            -e DATA_DIR=/tmp/data -e SESSION_SECRET=ci russisch-leren:${{ matrix.arch }}
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              docker exec rl node -p process.arch
              exit 0
            fi
            sleep 2
          done
          docker logs rl
          exit 1
