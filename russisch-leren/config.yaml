name: "Russisch Leren"
version: "1.12.0"
slug: russisch_leren
description: >-
  Russisch leren van A1 tot C2 met niveautoetsen, voortgangsregistratie,
  spaced repetition, offline ondersteuning en synchronisatie tussen
  toestellen. Werkt ook als installeerbare PWA op iPhone/iPad.
url: "https://github.com/danieldh00/Russianlanguageapp"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Webinterface"
webui: "http://[HOST]:[PORT:3000]/"
# Ingress lets Home Assistant serve the app behind its own login, on the same
# port the server already listens on. The published port stays as it is: the
# installed PWA on a phone reaches the app directly through the tunnel, which
# Ingress cannot do (its path changes every session, so a service worker and
# an installed app are not possible there).
ingress: true
ingress_port: 3000
homeassistant_api: true
environment:
  DATA_DIR: /data
options:
  session_secret: null
schema:
  session_secret: "password"
  anthropic_api_key: "password?"
  public_url: "str?"
  # Sonnet is the default: plenty for the mistake-uitleg and dialogue turns at
  # a fraction of Opus's cost. Pick Opus for extra nuance in the roleplays, or
  # Haiku to cut cost further.
  ai_model: "list(claude-opus-5|claude-sonnet-5|claude-haiku-4-5-20251001)?"
  # Ranglijst toont voor iedereen met een account naam, XP en voortgang van
  # alle andere accounts. Uitschakelen als de add-on voor meer dan het eigen
  # huishouden bereikbaar is.
  leaderboard_enabled: "bool?"
